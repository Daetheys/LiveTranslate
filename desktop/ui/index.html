<!doctype html>
<!--
  LiveTranslate UI. Phone-sized (designed for ~390x844, the iPhone 15 Pro viewport) and used
  as the visual reference for the iOS port. Rendered by pywebview; talks to Python through
  window.pywebview.api (see app.py `Api`) and receives engine events via window.onEngine(kind, payload).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveTranslate</title>
<style>
  :root {
    --bg: #0d0f13; --surface: #161920; --surface-2: #1e222b; --line: #2a2f3a;
    --text: #f3f4f6; --muted: #8b919c; --accent: #4f8cff; --rec: #ff4d5e; --warn: #f5b942;
    --radius: 20px; --shadow: 0 8px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eceef3; --line: #dfe2e8;
      --text: #14161a; --muted: #6b7280; --shadow: 0 8px 30px rgba(20,30,60,.12);
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { display: block; }

  .app { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

  /* ---- header ---- */
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 18px 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, #4f8cff, #8a5cff); color: #fff; font-weight: 700; font-size: 14px;
  }
  .top h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -.2px; }
  .status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.ready::before { background: #3ecf8e; }
  .status.live::before { background: var(--rec); animation: blink 1.2s infinite; }
  .status.error { color: var(--rec); }
  .status.error::before { background: var(--rec); }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---- mode switch ---- */
  .modes {
    margin: 4px 18px 8px; padding: 4px; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  }
  .modes button { padding: 8px 4px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .modes button.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }

  /* ---- chat ---- */
  .chat { flex: 1; overflow-y: auto; padding: 10px 14px 20px; scroll-behavior: smooth; }
  .chat::-webkit-scrollbar { width: 0; }
  .empty { height: 100%; display: grid; place-content: center; text-align: center; color: var(--muted); padding: 0 30px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }
  .empty b { color: var(--text); display: block; font-size: 16px; margin-bottom: 4px; }

  .msg { display: flex; flex-direction: column; align-items: flex-start; margin: 10px 0 14px; animation: pop .22s ease-out; }
  .msg.right { align-items: flex-end; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin: 0 6px 5px; }
  .who .name { font-weight: 700; color: var(--c); }
  .avatar {
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    background: var(--c); color: #fff; font-size: 10px; font-weight: 700;
  }
  .bubble {
    max-width: 86%; padding: 11px 14px 10px; border-radius: var(--radius);
    background: color-mix(in srgb, var(--c) 16%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
  }
  .msg.left .bubble { border-top-left-radius: 6px; }
  .msg.right .bubble { border-top-right-radius: 6px; }
  .tgt { font-size: 18px; font-weight: 600; line-height: 1.32; letter-spacing: -.1px; }
  .src { font-size: 13.5px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid color-mix(in srgb, var(--c) 20%, transparent); }
  .meta { font-size: 11px; color: var(--muted); margin: 4px 8px 0; display: flex; gap: 6px; align-items: center; }
  .unsure { color: var(--warn); font-weight: 600; }

  .msg.live .bubble { border-style: dashed; background: transparent; --c: var(--accent); }
  .msg.live .tgt { color: var(--muted); font-weight: 500; font-style: italic; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin: 0 1.5px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }

  /* ---- bottom bar ---- */
  .bottom {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 12px 26px 22px; background: linear-gradient(transparent, var(--bg) 30%);
  }
  .side { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); position: relative; }
  .side:hover { background: var(--surface-2); }
  .side.r { justify-self: end; }
  .badge {
    position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
  }
  .badge:empty { display: none; }
  .mic {
    width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: var(--accent); color: #fff; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
    transition: transform .12s, background .2s;
  }
  .mic:active { transform: scale(.94); }
  .mic:disabled { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: default; }
  .mic:disabled::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 3px solid transparent; border-top-color: var(--accent); animation: spin 1s linear infinite;
  }
  .mic.on { background: var(--rec); box-shadow: 0 8px 24px color-mix(in srgb, var(--rec) 45%, transparent); }
  .mic.on::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--rec);
    animation: ring 1.6s ease-out infinite;
  }
  .mic .stop { display: none; } .mic.on .stop { display: block; } .mic.on .go { display: none; }
  @keyframes ring { to { transform: scale(1.55); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- people sheet ---- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 78%;
    background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow);
    transform: translateY(105%); transition: transform .25s ease-out; display: flex; flex-direction: column;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; }
  .sheet h2 { font-size: 18px; margin: 6px 20px 2px; }
  .sheet .hint { font-size: 12.5px; color: var(--muted); margin: 0 20px 10px; }
  .people { overflow-y: auto; padding: 0 12px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .person .avatar { width: 34px; height: 34px; font-size: 14px; flex: none; }
  .person input {
    flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px dashed transparent;
    color: var(--text); font: inherit; font-weight: 600; padding: 4px 0; outline: none;
  }
  .person input:focus { border-bottom-color: var(--accent); }
  .person .count { font-size: 12px; color: var(--muted); }
  .person select {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 12.5px; padding: 5px 6px; max-width: 110px;
  }
  .noone { color: var(--muted); text-align: center; padding: 24px; }
  .slider { padding: 14px 20px 26px; }
  .slider label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .slider .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  .toast {
    position: fixed; left: 50%; bottom: 120px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--rec); color: #fff; padding: 9px 14px; border-radius: 12px; font-size: 13px; max-width: 90%;
    transition: .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="logo">LT</div>
    <div>
      <h1>LiveTranslate</h1>
      <div class="status" id="status">Starting…</div>
    </div>
  </header>

  <nav class="modes" id="modes">
    <button data-mode="auto" class="on">FR ⇄ HU</button>
    <button data-mode="hu">→ Magyar</button>
    <button data-mode="fr">→ Français</button>
  </nav>

  <main class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="big">🎙️</div>
      <b>Tap the mic and start talking</b>
      French and Hungarian are detected automatically. Each voice gets its own color.
    </div>
  </main>

  <footer class="bottom">
    <button class="side" id="clearBtn" title="New conversation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="mic" id="mic" disabled title="Start / stop (Space)">
      <svg class="go" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
      <svg class="stop" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
    <button class="side r" id="peopleBtn" title="People">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>
      <span class="badge" id="peopleCount"></span>
    </button>
  </footer>
</div>

<div id="sheetWrap">
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet">
    <div class="grab"></div>
    <h2>People</h2>
    <p class="hint">Tap a name to rename. If one person was split in two, merge them.</p>
    <div class="people" id="people"></div>
    <div class="slider" id="sliderBox">
      <label><span>Voice matching</span><span id="thrVal">0.80</span></label>
      <input type="range" id="thr" min="0.70" max="0.95" step="0.01" value="0.80">
      <div class="ends"><span>Fewer people</span><span>More people</span></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
// Bubbles of these source languages sit on the right ("my side"), the others on the left.
const RIGHT_LANGS = new Set(["fr"]);
const COLORS = ["#4f8cff", "#ff7a59", "#2fbf71", "#c46bff", "#f2b41c", "#14b8c4", "#ff5c8a", "#8f9bff"];

const S = { speakers: {}, messages: [], running: false, ready: false, langs: {} };
const $ = id => document.getElementById(id);
const api = () => window.pywebview && window.pywebview.api;

// ---------- engine events (called from Python) ----------
window.onEngine = (kind, p) => {
  if (kind === "status") setStatus(p);
  else if (kind === "ready") { S.ready = true; $("mic").disabled = false; setStatus("Ready", "ready"); }
  else if (kind === "error") { toast(p); if (!S.ready) setStatus(p, "error"); }
  else if (kind === "partial") showLive(p);
  else if (kind === "final") { hideLive(); if (p) addMessage(p); }
};

// ---------- rendering ----------
function speaker(sid) {
  if (sid == null) return { name: "", color: "#8b919c" };
  if (!S.speakers[sid]) S.speakers[sid] = { name: `Speaker ${sid}`, color: COLORS[(sid - 1) % COLORS.length] };
  return S.speakers[sid];
}
const short = code => (code || "").toUpperCase();
const initial = name => (name.trim()[0] || "?").toUpperCase();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function messageEl(m) {
  const sp = speaker(m.speaker);
  const box = el("div", "msg " + (RIGHT_LANGS.has(m.src) ? "right" : "left"));
  box.style.setProperty("--c", sp.color);
  if (sp.name) {
    const who = el("div", "who");
    const av = el("span", "avatar", initial(sp.name));
    who.append(av, el("span", "name", sp.name));
    box.append(who);
  }
  const b = el("div", "bubble");
  b.append(el("div", "tgt", m.translation));
  if (m.src !== m.tgt) b.append(el("div", "src", m.text));
  box.append(b);
  const meta = el("div", "meta", `${short(m.src)} → ${short(m.tgt)} · ${m.latency.toFixed(1)}s`);
  if (m.uncertain) meta.append(el("span", "unsure", "⚠ unsure"));
  box.append(meta);
  return box;
}

function nearBottom() { const c = $("chat"); return c.scrollHeight - c.scrollTop - c.clientHeight < 120; }
function scrollDown() { const c = $("chat"); c.scrollTop = c.scrollHeight; }

function addMessage(m) {
  const stick = nearBottom();
  S.messages.push(m);
  $("empty").classList.add("hidden");
  $("chat").append(messageEl(m));
  refreshPeople();
  if (stick) scrollDown();
}

function redraw() {
  const chat = $("chat");
  chat.querySelectorAll(".msg").forEach(e => e.remove());
  $("empty").classList.toggle("hidden", S.messages.length > 0);
  S.messages.forEach(m => chat.append(messageEl(m)));
  refreshPeople();
  scrollDown();
}

function showLive(p) {
  let live = document.querySelector(".msg.live");
  const stick = nearBottom();
  if (!live) {
    live = el("div", "msg live " + (RIGHT_LANGS.has(p.src) ? "right" : "left"));
    const b = el("div", "bubble");
    b.append(el("div", "tgt"), el("div", "src"));
    const dots = el("div", "who dots"); dots.innerHTML = "<span></span><span></span><span></span>";
    live.append(dots, b);
    $("empty").classList.add("hidden");
  }
  live.className = "msg live " + (RIGHT_LANGS.has(p.src) ? "right" : "left");
  live.querySelector(".tgt").textContent = p.translation;
  live.querySelector(".src").textContent = p.text;
  $("chat").append(live);  // keep it last
  if (stick) scrollDown();
}
function hideLive() {
  const live = document.querySelector(".msg.live");
  if (live) live.remove();
  if (!S.messages.length) $("empty").classList.remove("hidden");
}

function setStatus(text, cls = "") { const s = $("status"); s.textContent = text; s.className = "status " + cls; }
let toastTimer;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}

// ---------- people ----------
function refreshPeople() {
  const ids = Object.keys(S.speakers).map(Number);
  $("peopleCount").textContent = ids.length || "";
  const list = $("people");
  list.replaceChildren();
  if (!ids.length) { list.append(el("div", "noone", "Nobody has spoken yet.")); return; }
  for (const sid of ids) {
    const sp = S.speakers[sid];
    const n = S.messages.filter(m => m.speaker === sid).length;
    const row = el("div", "person");
    row.style.setProperty("--c", sp.color);
    const av = el("span", "avatar", initial(sp.name));
    const input = el("input"); input.value = sp.name; input.spellcheck = false;
    input.onchange = () => { sp.name = input.value.trim() || `Speaker ${sid}`; redraw(); };
    input.onkeydown = e => { if (e.key === "Enter") input.blur(); };
    const count = el("span", "count", `${n} msg`);
    row.append(av, input, count);
    if (ids.length > 1) {
      const sel = el("select");
      sel.append(new Option("Merge into…", ""));
      ids.filter(o => o !== sid).forEach(o => sel.append(new Option(S.speakers[o].name, o)));
      sel.onchange = () => sel.value && merge(sid, Number(sel.value));
      row.append(sel);
    }
    list.append(row);
  }
}

function merge(src, dst) {
  S.messages.forEach(m => { if (m.speaker === src) m.speaker = dst; });
  delete S.speakers[src];
  api() && api().merge(src, dst);
  redraw();
}

function openSheet(open) { document.body.classList.toggle("open", open); }

// ---------- controls ----------
async function toggle() {
  if (!S.ready || !api()) return;
  try {
    S.running = await api().toggle();
  } catch (e) {
    toast("Microphone error: " + (e && e.message || e));
    S.running = false;
  }
  $("mic").classList.toggle("on", S.running);
  setStatus(S.running ? "Listening…" : "Paused", S.running ? "live" : "ready");
}

$("mic").onclick = toggle;
$("peopleBtn").onclick = () => { refreshPeople(); openSheet(true); };
$("scrim").onclick = () => openSheet(false);
$("clearBtn").onclick = () => {
  S.messages = []; S.speakers = {};
  api() && api().new_conversation();
  hideLive(); redraw();
};
$("modes").onclick = e => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x === b));
  api() && api().set_mode(b.dataset.mode);
};
$("thr").oninput = e => { $("thrVal").textContent = Number(e.target.value).toFixed(2); };
$("thr").onchange = e => api() && api().set_threshold(Number(e.target.value));
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !/INPUT|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); toggle(); }
  if (e.key === "Escape") openSheet(false);
});

window.addEventListener("pywebviewready", async () => {
  const cfg = await api().config();
  S.langs = cfg.langs;
  document.querySelectorAll("#modes button").forEach(x => x.classList.toggle("on", x.dataset.mode === cfg.mode));
  $("thr").value = cfg.threshold; $("thrVal").textContent = cfg.threshold.toFixed(2);
  if (!cfg.diarization) { $("peopleBtn").classList.add("hidden"); }
  if (cfg.ready) window.onEngine("ready", null);
});
</script>
</body>
</html>
